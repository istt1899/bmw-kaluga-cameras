name: Verify public Store downloads

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        default: '0.7.0'
      catalog_sha256:
        type: string
        required: true
        default: '2c1514bd68e44b48f2447f6f7da9a834a27817989c0e74de5e2b32592904308a'
      app_sha256:
        type: string
        required: true
        default: 'ef42d79938839f459be43f80aee54f4c5019efdf752498a59ed498b7e022bb18'
      service_sha256:
        type: string
        required: true
        default: '6803b036d111048ff32ab2cba7fa40eff3a6105d80b1cc520feee7f626fa51f5'

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      CATALOG_SHA256: ${{ inputs.catalog_sha256 }}
      APP_SHA256: ${{ inputs.app_sha256 }}
      SERVICE_SHA256: ${{ inputs.service_sha256 }}
    steps:
      - name: Download anonymously with the Store user agent and verify pinned bytes
        shell: node {0}
        run: |
          const https = require('https'), crypto = require('crypto'), assert = require('assert');
          const version = process.env.RELEASE_VERSION, digest = b => crypto.createHash('sha256').update(b).digest('hex');
          assert(/^\d+\.\d+\.\d+$/.test(version));
          for (const key of ['CATALOG_SHA256','APP_SHA256','SERVICE_SHA256']) assert(/^[a-f0-9]{64}$/.test(process.env[key]));
          function once(url, hops = 0) {
            return new Promise((resolve,reject) => {
              const req = https.get(url, {headers:{'User-Agent':'mgu-updater/0.8.18'}}, res => {
                if ([301,302,303,307,308].includes(res.statusCode) && res.headers.location && hops < 6) {
                  res.resume(); const next = new URL(res.headers.location,url); assert.strictEqual(next.protocol,'https:');
                  resolve(once(next.toString(),hops+1)); return;
                }
                if (res.statusCode !== 200) {res.resume(); reject(Error('HTTP '+res.statusCode+' from '+new URL(url).hostname)); return;}
                const chunks = []; let size = 0;
                res.on('data', b => {size += b.length; if (size > 4*1024*1024) req.destroy(Error('Size limit')); else chunks.push(b);});
                res.on('end', () => resolve(Buffer.concat(chunks))); res.on('error',reject);
              });
              req.setTimeout(20000, () => req.destroy(Error('Download timeout'))); req.on('error',reject);
            });
          }
          async function get(url) {
            for (let n=0;n<5;n++) {
              try {return await once(url);} catch (error) {
                if (n===4) throw error;
                console.log('Retry '+(n+1)+': '+error.message);
                await new Promise(resolve=>setTimeout(resolve,1000*Math.pow(2,n)));
              }
            }
          }
          async function main() {
            const root='https://raw.githubusercontent.com/istt1899/bmw-kaluga-cameras/main/catalog.json';
            const data=await get(root); assert.strictEqual(digest(data),process.env.CATALOG_SHA256);
            console.log('PASS main catalog');
            const catalog=JSON.parse(data), expected={marku_kaluga_cameras:process.env.APP_SHA256,'marku-kaluga-cameras':process.env.SERVICE_SHA256};
            const checks=[['short-source',async()=>{assert.strictEqual(digest(await get('https://tinyurl.com/24appypy')),digest(data));}],
              ['releases-catalog',async()=>{assert.strictEqual(digest(await get('https://github.com/istt1899/bmw-kaluga-cameras/releases/download/catalog/catalog.json')),digest(data));}]];
            for (const id of Object.keys(expected)) checks.push([id,async()=>{
              const entry=catalog.components.find(c=>c.id===id); assert(entry); assert.strictEqual(entry.version,version);
              assert.strictEqual(entry.artifact.sha256,expected[id]); assert(entry.artifact.url.startsWith('https://github.com/istt1899/bmw-kaluga-cameras/releases/download/'));
              const bytes=await get(entry.artifact.url); assert.strictEqual(bytes.length,entry.artifact.size); assert.strictEqual(digest(bytes),expected[id]);
              console.log('PASS '+id+' '+version+' '+bytes.length+' '+digest(bytes));
            }]);
            const outcomes=await Promise.all(checks.map(async ([name,check])=>{
              try {await check();console.log('PASS '+name);return {name,result:'pass'};}
              catch(error){console.error('FAIL '+name+': '+error.message);return {name,result:'fail',error:error.message};}
            }));
            console.log('PUBLIC_DOWNLOAD_RESULTS '+JSON.stringify(outcomes));
            assert(outcomes.every(x=>x.result==='pass'),'One or more public download routes failed; see individual results');
          }
          main().catch(error=>{console.error(error.stack);process.exitCode=1;});
